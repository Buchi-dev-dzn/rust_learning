# 学習サイト (studio) が読み込むコース定義。
# 演習ファイルは course/exercises/<chapter>/*.rs から自動検出される (ファイル名順)。

[[stage]]
id = 1
title = "基礎"
summary = "Rust の文法と、Rust 最大の特徴である所有権・借用を身につける。"
goal = "小さな関数・構造体・enum を使ったプログラムを、コンパイラと会話しながら書ける"
hours = "15〜25 時間"
chapters = ["01_basics", "02_ownership", "03_borrowing", "04_structs", "05_enums", "06_collections", "07_errors", "08_modules"]
projects = ["p01_minigrep", "p02_todo_cli"]

[[stage]]
id = 2
title = "中級"
summary = "トレイト・ジェネリクス・ライフタイム・イテレータ・スマートポインタ・並行処理。"
goal = "再利用可能な抽象を設計し、スレッドとチャネルで並行処理を書ける"
hours = "20〜30 時間"
chapters = ["09_traits", "10_lifetimes", "11_iterators", "12_smart_pointers", "13_testing", "14_concurrency"]
projects = []

[[stage]]
id = 3
title = "システム / CLI"
summary = "標準入出力・ファイル・引数・終了コード、そして Unicode 文字列の表示幅。"
goal = "Unix 流儀の CLI ツールを標準ライブラリだけで作れる"
hours = "10〜15 時間"
chapters = ["15_io_cli", "16_unicode"]
projects = []

[[stage]]
id = 4
title = "ターミナル / TUI"
summary = "ANSI エスケープ、raw モード、crossterm、TUI アーキテクチャ、ratatui、そして自作フレームワーク。"
goal = "ターミナルの仕組みを理解し、ライブラリあり/なしの両方で TUI アプリを作れる"
hours = "30〜50 時間"
chapters = ["17_ansi", "18_raw_input", "19_crossterm", "20_tui_architecture", "21_ratatui", "22_own_tui"]
projects = ["p03_ansi_raw", "p04_crossterm_basics", "p05_editor", "p06_ratatui_app", "p07_own_tui"]

[[stage]]
id = 5
title = "卒業課題"
summary = "仕様書と受け入れテストだけを頼りに、ターミナルアプリを一から作る総合演習。"
goal = "ターミナル関係のアプリを自力で設計・実装・テストできる"
hours = "40 時間〜"
chapters = ["23_final"]
projects = []

