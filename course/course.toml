# ---------------------------------------------------------------- projects
[[project]]
id = "p01_minigrep"
title = "minigrep: 自作 grep"
difficulty = 1
chapters = ["07_errors", "15_io_cli"]
summary = "コマンドライン引数とファイル読み込み、Result によるエラー処理、テスト。"
run = "cargo run -p p01_minigrep -- fn projects/p01_minigrep/src/lib.rs"
tui = false

[[project]]
id = "p02_todo_cli"
title = "todo: サブコマンド付き CLI"
difficulty = 2
chapters = ["06_collections", "07_errors", "15_io_cli"]
summary = "サブコマンド解析を自作し、ファイルに永続化する ToDo 管理ツール。"
run = "cargo run -p p02_todo_cli -- list"
tui = false

[[project]]
id = "p03_ansi_raw"
